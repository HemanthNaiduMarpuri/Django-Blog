<header class="text-gray-600 body-font">
  <div
    class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center"
  >
    <a
      class="flex title-font font-medium items-center text-gray-900 mb-4 md:mb-0"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        class="w-10 h-10 text-white p-2 bg-indigo-500 rounded-full"
        viewBox="0 0 24 24"
      >
        <path
          d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
        ></path>
      </svg>
      <span class="ml-3 text-xl"><a href="{% url 'home' %}">Blogify</a></span>
    </a>

    <nav
      class="md:mr-auto md:ml-4 md:py-1 md:pl-4 md:border-l md:border-gray-400 flex flex-wrap items-center text-base justify-center"
    >
      <a href="{% url 'home' %}" class="mr-5 hover:text-gray-900">Home</a>
      <a class="mr-5 hover:text-gray-900" href="{% url 'all-posts' %}"
        >All Posts</a
      >
      <a class="mr-5 hover:text-gray-900" href="{% url 'about-us' %}"
        >About Us</a
      >
      <form method="get" action="{% url 'search' %}" class="flex">
        <input
          type="text"
          name="search"
          placeholder="Search posts..."
          class="border px-3 py-2 rounded-l w-full ml-20"
        />
        <button type="submit" class="bg-indigo-500 text-white px-4 rounded-r">
          Search
        </button>
      </form>

      {% if request.user.is_admin %}
        <button
          class="inline-flex justify-center items-center bg-blue-100 border-0 py-1 px-3 ml-20 focus:outline-none hover:bg-gray-200 rounded text-base mt-4 md:mt-0"
        >
          <a href="{% url 'post-create' %}">Create Post</a>
        </button>
      {% endif %}
    </nav>

    <div>
      {% if user.is_authenticated %}
      <span class="mr-4 text-gray-700 font-medium"
        >Hi, {{ user.username }}</span
      >
      <form method="post" action="{% url 'logout' %}" class="inline">
        {% csrf_token %}
        <button
          type="submit"
          class="inline-flex items-center bg-red-500 text-white border-0 py-1 px-3 focus:outline-none hover:bg-red-600 rounded text-base mt-4 md:mt-0"
        >
          Logout
        </button>
      </form>
      {% else %}
      <button
        class="inline-flex items-center bg-gray-100 border-0 py-1 px-3 mr-4 focus:outline-none hover:bg-gray-200 rounded text-base mt-4 md:mt-0"
      >
        <a href="{% url 'login' %}">Login</a>
      </button>
      <button
        class="inline-flex items-center bg-gray-100 border-0 py-1 px-3 focus:outline-none hover:bg-gray-200 rounded text-base mt-4 md:mt-0"
      >
        <a href="{% url 'signup' %}">Sign Up</a>
      </button>
      {% endif %}
    </div>
  </div>
</header>
