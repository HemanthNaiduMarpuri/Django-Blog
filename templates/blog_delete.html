{% extends 'base.html' %}
{% block content %}
<section class="flex items-center justify-center min-h-screen bg-gray-50">
  <div class="bg-white shadow-md rounded-lg p-8 max-w-lg w-full text-center">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Delete Post</h1>
    <p class="text-gray-600 mb-6">
      Are you sure you want to delete the post 
      <span class="font-semibold text-red-500">"{{ object.title }}"</span>?
      This action cannot be undone.
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="flex justify-center gap-4">
        <button 
          type="submit" 
          class="bg-red-500 hover:bg-red-600 text-white font-medium px-4 py-2 rounded-lg shadow">
          Yes, Delete
        </button>
        <a 
          href="{% url 'home' %}" 
          class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium px-4 py-2 rounded-lg shadow">
          Cancel
        </a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
