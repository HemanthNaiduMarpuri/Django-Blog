{% extends 'base.html' %}
{% block content %}
<section class="text-gray-600 body-font">
  <div class="container px-5 py-12 mx-auto">
    <h1 class="text-2xl font-bold mb-6">Search Results</h1>

    {% if results %}
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for post in results %}
          <div class="bg-gray-100 p-6 rounded-lg">
            <h2 class="text-xl font-semibold mb-2">
              <a href="{% url 'post-detail' post.id %}" class="text-indigo-500 hover:underline">
                {{ post.title }}
              </a>
            </h2>
            <p class="text-gray-700">{{ post.content|truncatewords:20 }}</p>
            <a href="{% url 'post-detail' post.id %}" class="text-indigo-500 inline-flex items-center mt-5">
            View Post
            <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M5 12h14M12 5l7 7-7 7"></path>
            </svg>
          </a>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p>No posts found matching your query.</p>
    {% endif %}
  </div>
</section>
{% endblock %}
