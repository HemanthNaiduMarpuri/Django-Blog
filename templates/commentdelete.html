{% extends 'base.html' %}
{% block content %}
<section class="text-gray-600 body-font">
  <div class="container px-5 py-12 mx-auto">
    <div class="max-w-lg mx-auto bg-white shadow-lg rounded-lg p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-4">
        Confirm Delete
      </h2>
      <p class="text-gray-700 mb-6">
        Are you sure you want to delete this comment?
      </p>
      <div class="p-4 bg-gray-100 rounded mb-6">
        <p class="text-gray-800">{{ object.comment }}</p>
        <p class="text-sm text-gray-500">
          — {{ object.author }} • {{ object.created_at|date:"M d, Y H:i" }}
        </p>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="flex items-center space-x-4">
          <button
            type="submit"
            class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded"
          >
            Yes, Delete
          </button>
          <a
            href="{% url 'post-detail' object.post.id %}"
            class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded"
          >
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
