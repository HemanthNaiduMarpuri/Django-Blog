{% extends "base.html" %}
{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-8">
    <h2 class="text-2xl font-bold text-center mb-6">Login</h2>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <!-- Username -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Username</label>
        {{ form.username }}
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        {{ form.password }}
      </div>

      <!-- Submit Button -->
      <button type="submit"
        class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition">
        Login
      </button>
    </form>
    <p class="text-center text-sm text-gray-600 mt-4">
      <a href="{% url 'password_reset' %}" class="text-indigo-600 hover:underline">Forgot Password?</a>
    </p>

    <p class="text-center text-sm text-gray-600 mt-4">
      Don’t have an account?
      <a href="{% url 'signup' %}" class="text-indigo-600 hover:underline">Sign Up</a>
    </p>
  </div>
</div>
{% endblock %}
